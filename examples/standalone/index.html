<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AviFlow - Standalone Examples</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="header">
        <h1>&#x1F525; AviFlow Standalone Examples</h1>
        <p class="subtitle">Interactive test cases demonstrating every data-attribute supported by the library. <br>Each
            card is self-contained and can be copied as a new case.</p>

        <div class="header-right">
            <button class="theme-toggle" title="Toggle dark mode">Sun | Moon</button>
        </div>
    </div>

    <div class="grid" 
        data-role="grid" 
        data-action="fetch" 
        data-url="./data-cards.json" 
        data-success="renderCards">
        <div class="card" data-template="true">
            <h3>${item.title}</h3>
            <div class="trigger-wrap">
                <div class="action">${item.action}</div>
                <pre><code>${item.code}</code></pre>
            </div>
            <div class="box" id="${item.targetId}">Waiting for request&hellip;</div>
            <div class="usage-note">${item.usageNote}</div>
        </div>
    </div>

    <!-- Document content generator script -->
    <script>
        

    </script>

    <!-- Theme toggle script -->
    <script>
        (function () {
            var $toggle = document.querySelector('.theme-toggle');
            if (!$toggle) return;

            // Read stored preference, otherwise follow system preference
            var stored = localStorage.getItem('avi-flow-theme') || null;
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            $toggle.textContent = (stored === 'dark' || (!stored && prefersDark)) ? 'Sun' : 'Moon';

            // Toggle on click
            function applyTheme() {
                if (document.documentElement.getAttribute('data-theme') === 'dark') {
                    document.documentElement.setAttribute('data-theme', '');
                    localStorage.setItem('avi-flow-theme', 'light');
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('avi-flow-theme', 'dark');
                }
            }

            $toggle.addEventListener('click', applyTheme);
        })();
    </script>

    <!-- Library script -->
    <script src="../../src/index.js"></script>
    
    <!-- Page data-->
    <script src="./data-cards.js"></script>

    <!-- App logic: callbacks + initialization -->
    <script>

        document.addEventListener('DOMContentLoaded', async () => {
            const avi = new AviFlow();

            // Custom callback shared across cases
            avi.onSuccess = (data) => { console.log('[OK]', data); };
            avi.onError = (error) => { console.error('[ERR]', error); };

            // Data is now loaded from data-cards.json

            //get the cards:
            const grid = document.querySelector('[data-role=grid]');
            const tplCard = grid.querySelector('[data-template=true]');
            const template = tplCard.outerHTML.replace('data-template="true"', '');
            tplCard.remove();

            // Compile the HTML template string into a dynamic template literal function
            const renderCard = new Function('item', 'return `' + template + '`;');

            dataCards.forEach(item => {
                // Escape the HTML code snippet so it renders as text in the code tag
                const safeItem = {
                    ...item,
                    code: item.action.replace(/</g, '&lt;').replace(/>/g, '&gt;')
                };
                const html = renderCard(safeItem);
                grid.insertAdjacentHTML('beforeend', html);
            });
        });
    </script>
</body>

</html>
