<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AviFlow - Standalone Examples</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <button class="theme-toggle" aria-label="Toggle dark/light mode" data-action="toogleTheme">
            <span class="icon-sun"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
            <span class="icon-moon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg></span>
        </button>
        <div class="header-wrapper">
            <h1>&#x1F525; AviFlow Standalone Examples</h1>
            <p class="subtitle">Interactive test cases demonstrating every data-attribute supported by the library. <br>Each card is self-contained and can be copied as a new case.</p>
        </div>
    </header>

    <div class="grid" data-role="grid">
        <div class="card" data-template="true">
            <h3>${item.title}</h3>
            <div class="trigger-wrap">
                <div class="action">${item.action}</div>
                <pre><code>${item.code}</code></pre>
            </div>
            <div class="box" id="${item.targetId}">Waiting for request&hellip;</div>
            <div class="usage-note">${item.usageNote}</div>
        </div>
    </div>

    <!-- Library script -->
    <!-- for debugging use: -- >
    <script type="module" src="../../src/index.js"></script>
    <! -- -->
    <!-- for testing use: --
    <script src="../../dist/aviflow.min.js"></script>
-->
    <script src="https://cdn.jsdelivr.net/npm/aviflow@1.1.3/dist/aviflow.min.js" crossorigin="anonymous" integrity="sha512-svhkJwM1Yhx4Hv1k+epOBd9Q7aR08jv2zPuLG4SY7R66v7cvWMnTCSRFpWhPmf8jszsz0wCzyPGVndRbdegW0A=="></script>
    <!-- -->
    <!-- Page data-->
    <script src="./data-cards.js"></script>

    <!-- App logic: callbacks + initialization -->
    <script src="./app.js"></script>
</body>

</html>
