name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Required for npm provenance tracking

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm' # Speeds up installation by caching dependencies

      - name: Install dependencies
        run: npm ci

      - name: Run tests (if applicable)
        run: npm test --if-present

      - name: Build package (if applicable)
        run: npm run build --if-present

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_AVIFLOW }}name: Publish Package to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # Enables OIDC token generation

jobs:
  publish:
    runs-on: ubuntu-latest # Provenance requires a GitHub-hosted runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: node --no-warnings --experimental-vm-modules node_modules/jest/bin/jest.js --coverage

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build package
        run: npm run build --if-present

      - name: Publish to npm with Provenance
        run: npm publish --provenance