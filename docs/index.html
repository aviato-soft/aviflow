<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AviFlow Documentation</title>

  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon/apple-touch-icon.png">
  <link rel="icon" href="assets/img/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon/favicon-32x32.png">

<body data-flow="[ scroll.window.passive -> scrollSpy -| ][ resize.window -> scrollSpy -| ]">
  <header>

    <a class="logo" href="#overview" aria-label="AviFlow">
      <img src="./assets/img/aviflow-logo.svg" alt="AviFlow logo" width="32" height="32" class="me-2">
      <span>AviFlow</span>
    </a>

    <div class="find" role="search">
      <input id="q" data-flow="[ input -> highlight -| ][ keydown -> highlightKey -| ]" type="text" placeholder="Find in page (F3)" aria-label="Find in page" autocomplete="off"
        spellcheck="false">
      <span class="cnt" id="cnt"></span>
      <button type="button" id="prev" data-flow="goFoundPrev" title="Previous (Shift+Enter)" aria-label="Previous match"><svg
          xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-chevron-up"
          viewBox="0 0 16 16">
          <path fill-rule="evenodd"
            d="M7.646 4.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1-.708.708L8 5.707l-5.646 5.647a.5.5 0 0 1-.708-.708z" />
        </svg></button>
      <button type="button" id="next" data-flow="goFoundNext" title="Next (Enter / F3)" aria-label="Next match"><svg
          xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-chevron-down"
          viewBox="0 0 16 16">
          <path fill-rule="evenodd"
            d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708" />
        </svg></button>

          <path d="M8 15A7 7 0 1 0 8 1zm0 1A8 8 0 1 1 8 0a8 8 0 0 1 0 16" />
        </svg>

        </svg>
        <svg class="moon bi bi-moon-stars-fill" viewBox="0 0 16 16">

        </svg>
      </button>
    </div>
  </header>

  <div class="wrap">
    <nav data-role="main-menu">
      <h2>AviFlow Docs ToC</h2>
    </nav>

    <main data-role="main-content">
      <div class="main-content-top" id="top">
        <p class="text-center"><img src="assets/img/aviflow-logo.svg" alt="AviFlow logo" width="160" height="160">
        </p>
        <h1 class="display-4 text-center" id="aviflow"><b>Avi</b>Flow</h1>
        <div class="lead text-center">
          <p>Declarative data flow for the DOM.</p>
          <p>Describe <strong><code>[ event -> action -> target ]</code></strong> in a single HTML attribute.</p>
        </div>
      </div>
      <hr class="my-4">
    </main>


  </div>

  <footer>
    <span>AviFlow API documentation - &copy; 2026 Aviato Soft</span>
